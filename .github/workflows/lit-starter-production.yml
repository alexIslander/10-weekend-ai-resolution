name: Lit starter production deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lit-starter-production.yml'
      - '.github/workflows/lit-starter-preview.yml'
      - '.github/workflows/lit-starter-ci.yml'
      - '01-lit-starter/**'
  workflow_dispatch:

env:
  NODE_VERSION: 22
  CF_PROJECT_NAME: 01-lit-starter
  CF_DIST_PATH: 01-lit-starter/dist

concurrency:
  group: lit-starter-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 01-lit-starter/package-lock.json

      - name: Install dependencies
        working-directory: 01-lit-starter
        run: npm ci

      - name: Run tests
        working-directory: 01-lit-starter
        run: npm run test

      - name: Build app
        working-directory: 01-lit-starter
        run: npm run build

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler@3 pages deploy "$CF_DIST_PATH"
          --project-name "$CF_PROJECT_NAME"
          --branch main
          --commit-dirty true
