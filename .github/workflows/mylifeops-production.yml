name: MyLifeOps production deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mylifeops-production.yml'
      - '.github/workflows/mylifeops-preview.yml'
      - '.github/workflows/mylifeops-ci.yml'
      - '05-MyLifeOps/**'
      - '!05-MyLifeOps/admin/**'
  workflow_dispatch:

env:
  NODE_VERSION: 22
  CF_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'mylifeops' }}
  CF_DIST_PATH: 05-MyLifeOps/dist

concurrency:
  group: mylifeops-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 05-MyLifeOps/package-lock.json

      - name: Install dependencies
        working-directory: 05-MyLifeOps
        run: npm ci

      - name: Run tests
        working-directory: 05-MyLifeOps
        run: npm run test

      - name: Build app
        working-directory: 05-MyLifeOps
        run: npm run build

      - name: Verify Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CF_PROJECT_NAME"

      - name: Show deploy target
        run: echo "Deploying production to Cloudflare Pages project '$CF_PROJECT_NAME'"

      - name: Deploy to Cloudflare Pages (production)
        run: >-
          npx wrangler@3 pages deploy "$CF_DIST_PATH"
          --project-name "$CF_PROJECT_NAME"
          --branch main
          --commit-dirty true
